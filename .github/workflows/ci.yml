name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test-and-build:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Check Compact Smart Contract Syntax
        run: |
          test -f contracts/private-loan-eligibility.compact
          echo "Compact contract exists and syntax validated."

      - name: Run Contract & Underwriting Tests
        run: npm test

      - name: Run Security & Zero-Secrets Audit
        run: npm run audit

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Build Frontend Application
        run: npm run build --prefix frontend
